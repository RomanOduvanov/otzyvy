<script>
/* общий модуль страниц рейтинга: утилиты, карточка ученика, карточка x2, плашка тарифа.
   gamify.py вставляет этот файл в rating_template.html и embed_template.html вместо комментария FS_JS */
const FS={
 esc:s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
 fmt:n=>Number(n).toLocaleString('ru-RU'),
 M:['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],
 day(d){return d.getDate()+' '+FS.M[d.getMonth()]+' в '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')},
 uid(){const m=(location.hash||'').match(/u=(\d+)/);return m?m[1]:null},
 async hash(u){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('gc2:'+u));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16)},
 pl(n,f){n=Math.abs(n)%100;const n1=n%10;return n>10&&n<20?f[2]:n1>1&&n1<5?f[1]:n1==1?f[0]:f[2]},
 /* неразрывный пробел после коротких слов — без висячих предлогов */
 nbsp(el){const re=/(^|[\s(«"—])(в|во|и|к|ко|с|со|о|об|у|а|но|по|на|до|от|за|из|не|ни|ты|мы|я|для|без|при|про|через)\s+/gi;const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const t=n.nodeValue.replace(re,(m,a,b)=>a+b+'\u00a0').replace(re,(m,a,b)=>a+b+'\u00a0');if(t!==n.nodeValue)n.nodeValue=t}
  /* предлог в конце текста перед ссылкой */el.querySelectorAll('a').forEach(a=>{const p=a.previousSibling;if(p&&p.nodeType===3)p.nodeValue=p.nodeValue.replace(/(\s)(\S{1,3})\s$/,'$1$2\u00a0')})},

 /* статусы: топ-3 и «в ударе» (топ-10 по баллам за неделю, кроме топ-3, от 200 баллов) */
 status(D){const top={},hot={};D.rows.forEach(x=>{if(x.place<=3&&x.pts>0)top[x.h]=x.place});
  D.rows.filter(x=>!top[x.h]&&x.week>=200).sort((a,b)=>b.week-a.week).slice(0,7).forEach(x=>hot[x.h]=1);return {top,hot}},
 FIRE:'<svg class="fire" viewBox="0 0 24 24" aria-label="В ударе"><defs><linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a3d"/><stop offset=".55" stop-color="#ff9a3d"/><stop offset="1" stop-color="#ffd36b"/></linearGradient></defs><path fill="url(#fg)" d="M12 2c.6 3.2 3.4 4.9 4.6 7.6 1.6 3.6.2 8.3-3.7 9.9-4.3 1.8-9.1-1.2-9.1-5.9 0-2.6 1.3-4.3 2.9-5.6-.1 1.5.4 2.9 1.6 3.6-.4-3.9 1.4-7.1 3.7-9.6z"/><path fill="#fff3c4" opacity=".85" d="M12.3 12.2c.3 1.6 1.7 2.5 1.7 4.1 0 1.5-1.1 2.6-2.3 2.6-1.4 0-2.4-1.1-2.3-2.5.1-1.5 1.6-2.4 2.9-4.2z"/></svg>',
 CROWN:'<svg class="crown" viewBox="0 0 24 24" aria-label="Лидер потока"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#ffcf4d"/><stop offset="1" stop-color="#e09a1a"/></linearGradient></defs><path fill="url(#cg)" d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-2 10H5z"/><rect x="5" y="19" width="14" height="2" rx="1" fill="#e09a1a"/></svg>',
 /* достижения: [название, условие, проверка, иконка] */
 ACH:[
  ['Ранняя пташка','пройти уроки модуля в первые 48 часов',(r,s)=>r.medals.includes('Ранняя пташка'),'M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18 12h3M16.3 7.7l2.1-2.1M7 17a5 5 0 0 1 10 0M4 20h16'],
  ['Голос потока','заполнить 8+ анкет обратной связи',(r,s)=>r.medals.includes('Голос потока'),'M4 5h16v11H9l-5 4z'],
  ['Максималист','сдать 3 домашки на максимальном уровне',(r,s)=>r.medals.includes('Максималист'),'M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z'],
  ['Первый в потоке','первым сдать принятую домашку',(r,s)=>r.medals.includes('Первый в потоке'),'M6 21V4M6 4h11l-2.5 4L17 12H6'],
  ['Топ-3 потока','войти в тройку лидеров рейтинга',(r,s)=>!!s.top[r.h],'M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8'],
  ['В ударе','быть в топе по баллам за неделю',(r,s)=>!!s.hot[r.h]||!!s.top[r.h]&&r.week>=200,'M12 3c.5 2.7 2.9 4.1 3.9 6.4 1.4 3-.2 7-3.1 8.3-3.6 1.5-7.7-1-7.7-5 0-2.2 1.1-3.6 2.4-4.7 0 1.3.4 2.4 1.4 3-.4-3.2 1.2-5.9 3.1-8z'],
  ['Марафонец','пройти 50+ уроков',(r,s)=>r.lessons>=50,'M13 4a2 2 0 1 0 0 .1M7 21l3-6 3 2v5M10 15l1-5 4 3 3-1M8 11l3-2'],
  ['Точно в срок','выполнить 50% заданий в срок x2',(r,s)=>r.ontime>=50,'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z'],
  ['Премиум Amazon','максимальный тариф курса',(r,s)=>r.tar===FS.TOP_TARIFF,'M3 9l3-5h12l3 5-9 11zM3 9h18M9 4l3 5 3-5M12 9v11']],
 /* профиль ученика (рейтинг — модалка, профиль GetCourse — iframe). o: {awards, me (bool)} */
 profile(el,D,r,o){const A=o.awards,esc=FS.esc,fmt=FS.fmt,S=FS.status(D);
  const i=D.ranks.findIndex(x=>x[0]===r.rank),cur=D.ranks[i],nx=D.ranks[i+1],lo=cur[1],hi=nx?nx[1]:lo,pc=nx?Math.max(3,Math.min(100,Math.round(100*(r.pts-lo)/(hi-lo)))):100;
  const tp=S.top[r.h],hot=S.hot[r.h],vip=r.tar===FS.TOP_TARIFF,got=FS.ACH.filter(a=>a[2](r,S)).length;
  const ic=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  el.innerHTML=`<div class="pf${tp?' pf-top pf-t'+tp:''}${hot?' pf-hot':''}${vip?' pf-vip':''}">
  <div class="pf-hd"><div class="pf-aw"><div class="pf-awi" style="background-image:url(${A}${cur[2]}.jpg)"></div>${tp?`<span class="pf-place">${tp}</span>`:''}</div>
   <div class="pf-id"><div class="pf-l">${o.me?'Твой профиль на курсе':'Профиль ученика'}</div><div class="pf-n">${esc(r.name)}${vip?FS.STAR:''}${hot?FS.FIRE:''}${tp===1?FS.CROWN:''}</div>
    <div class="pf-ch"><span class="pf-c pf-rk">${esc(r.rank)}</span>${tp?`<span class="pf-c pf-ct">Топ-${tp} потока</span>`:''}${hot?'<span class="pf-c pf-ch-hot">В ударе · +'+fmt(r.week)+' за неделю</span>':''}${vip?'<span class="pf-c pf-cv">★ Премиум Amazon</span>':''}</div></div>
   <div class="pf-pos"><div class="pf-l">Место</div><div class="pf-pv">${r.place}<small> из ${D.n}</small></div></div></div>
  <div class="pf-st"><div><b>${fmt(r.pts)}</b><span>${FS.pl(r.pts,['балл','балла','баллов'])}</span></div><div><b>+${fmt(r.week)}</b><span>за неделю</span></div><div><b>${r.lessons}</b><span>${FS.pl(r.lessons,['урок','урока','уроков'])}</span></div><div><b>${r.hw}</b><span>${FS.pl(r.hw,['домашка','домашки','домашек'])}</span></div><div><b>${r.ontime}%</b><span>в срок x2</span></div></div>
  <div class="pf-pr"><div class="pf-pl"><span>${esc(cur[0])}</span><span>${nx?esc(nx[0])+' · '+fmt(hi):'вершина'}</span></div><div class="pf-bar"><i style="width:${pc}%"></i></div>
   <div class="pf-nx">${nx?`Ещё <b>${fmt(Math.max(0,hi-r.pts))}</b> ${FS.pl(hi-r.pts,['балл','балла','баллов'])} до звания «${esc(nx[0])}»`:'Вершина карьерной лестницы'}</div></div>
  <div class="pf-h2">Карьерная лестница</div>
  <div class="pf-lad">${D.ranks.map((x,j)=>`<div class="pf-rg${j<=i?' got':''}${j===i?' cur':''}" title="${esc(x[0])} · ${fmt(x[1])}"><i style="background-image:url(${A}${x[2]}.jpg)"></i><span>${esc(x[0])}</span></div>`).join('')}</div>
  <div class="pf-h2">Достижения <small>${got} из ${FS.ACH.length}</small></div>
  <div class="pf-ach">${FS.ACH.slice().sort((a,b)=>b[2](r,S)-a[2](r,S)).map(a=>{const g=a[2](r,S);return `<div class="pf-a${g?' got':''}"><div class="pf-ai">${ic(a[3])}${g?'':'<em>'+ic('M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z')+'</em>'}</div><b>${esc(a[0])}</b><span>${g?'получено':esc(a[1])}</span></div>`}).join('')}</div></div>`;
  FS.nbsp(el)},
 STAR:'<svg class="vip" viewBox="0 0 24 24" aria-label="Премиум Amazon"><defs><linearGradient id="vgp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c6ff"/><stop offset=".5" stop-color="#c38bff"/><stop offset="1" stop-color="#8b45e6"/></linearGradient></defs><path fill="url(#vgp)" d="M12 2.2l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z"/></svg>',
 SUPPORT:'https://t.me/zabota_oduvanov',
 TOP_TARIFF:'Премиум Амазон',
 /* срок доступа: [значение, подпись] */
 access(a){if(a==='inf')return['Бессрочный','навсегда в кабинете'];if(!a)return null;const d=new Date(a+'T23:59:59'),n=Math.ceil((d-new Date())/864e5);
  return n>0?[n+' '+FS.pl(n,['день','дня','дней']),'до '+d.getDate()+' '+FS.M[d.getMonth()]]:['Закончился','продли доступ в поддержке']},
 /* карточка ученика. o: {awards, link (url рейтинга или null), target} */
 me(el,D,r,o){const A=o.awards,esc=FS.esc,fmt=FS.fmt;
  if(!r){el.innerHTML=`<div class="mc-top"><div class="mc-aw" style="background-image:url(${A}r1.jpg)"></div><div class="mc-id"><div class="mc-l">Карьерная лестница</div><div class="mc-r">Скоро здесь будет твоё место</div></div></div>
   <p class="mc-nx">Баллы начисляются за уроки, анкеты и домашки. Рейтинг пересчитывается утром и вечером — после первого урока ты появишься в нём.</p>${o.link?`<a class="mc-btn" href="${o.link}" target="${o.target||'_top'}">Открыть рейтинг потока <i>→</i></a>`:''}`;return}
  const i=D.ranks.findIndex(x=>x[0]===r.rank),cur=D.ranks[i],nx=D.ranks[i+1],lo=cur[1],hi=nx?nx[1]:lo,pc=nx?Math.max(3,Math.min(100,Math.round(100*(r.pts-lo)/(hi-lo)))):100;
  el.innerHTML=`<div class="mc-top"><div class="mc-aw" style="background-image:url(${A}${cur[2]}.jpg)"></div>
   <div class="mc-id"><div class="mc-l">Твоё звание</div><div class="mc-r">${esc(r.rank)}</div></div>
   <div class="mc-pos"><div class="mc-l">Место в потоке</div><div class="mc-pv">${r.place}<small> из ${D.n}</small></div></div></div>
   <div class="mc-st"><div><b>${fmt(r.pts)}</b><span>${FS.pl(r.pts,['балл','балла','баллов'])}</span></div><div><b>+${fmt(r.week)}</b><span>за неделю</span></div><div><b>${r.lessons}</b><span>${FS.pl(r.lessons,['урок','урока','уроков'])}</span></div></div>
   <div class="mc-pr"><div class="mc-pl"><span>${esc(cur[0])}</span><span>${nx?esc(nx[0])+' · '+fmt(hi):'вершина'}</span></div><div class="mc-bar"><i style="width:${pc}%"></i></div>
   <div class="mc-nx">${nx?`Ещё <b>${fmt(Math.max(0,hi-r.pts))} ${FS.pl(hi-r.pts,['балл','балла','баллов'])}</b> до звания «${esc(nx[0])}»${nx[0]==='Дизайнер-миллионер'?' и 80% заданий в срок x2':''}`:'Ты на вершине карьерной лестницы'}</div></div>
   ${r.medals.length?'<div class="mc-md">'+r.medals.map(m=>'<span>'+esc(m)+'</span>').join('')+'</div>':''}
   ${o.link?`<a class="mc-btn" href="${o.link}" target="${o.target||'_top'}">Открыть рейтинг потока <i>→</i></a>`:''}`},
 /* плашка тарифа и доступа */
 tariff(el,r){if(!r||(!r.tar&&!r.acc)){el.style.display='none';return}const a=FS.access(r.acc),top=r.tar===FS.TOP_TARIFF;
  el.innerHTML=`<div class="tc-i"><div class="mc-l">Твой тариф</div><div class="tc-v">${FS.esc(r.tar||'—')}${top?'<em>максимальный</em>':''}</div></div>
   ${a?`<div class="tc-i"><div class="mc-l">Доступ к курсу</div><div class="tc-v">${a[0]}<small>${a[1]}</small></div></div>`:''}
   ${top?`<span class="tc-b off" aria-disabled="true" title="У тебя открыты все модули, включая Amazon">Максимальный тариф <i>✓</i></span>`:`<a class="tc-b" href="${FS.SUPPORT}" target="_blank" rel="noopener">Повысить тариф <i>→</i></a>`}`},
 /* карточка x2. link — куда ведёт «карьерная лестница» */
 x2(el,X,link,target){
  const lad=`<a class="x2-a" href="${link}" target="${target||'_self'}">карьерной лестнице</a>`;
  const rules=(l,h)=>`<ul class="x2-u"><li><span>Уроки и анкеты</span><b>x2 ${l}</b></li><li><span>Домашки</span><b>x2 ${h}</b></li></ul>`;
  if(!X){el.innerHTML=`<div><div class="x2-t">Двойные баллы за скорость</div>${rules('первые 48 часов','первые 72 часа')}<p class="x2-p">Отсчёт начинается с открытия модуля. Больше баллов — быстрее растёшь по ${lad}.</p></div>`;return}
  const op=new Date(X.opens),lu=new Date(X.lessons_until),hu=new Date(X.hw_until),mod=FS.esc(X.module);
  const draw=()=>{const now=new Date();let title,lead,list,target,label;
   if(now<op){title='Скоро двойные баллы';lead=`<b>${FS.day(op)}</b> откроется ${mod}. Успей в первые часы:`;list=rules('первые 48 часов','первые 72 часа');target=op;label='до старта x2'}
   else if(now<lu){title='Идут двойные баллы';lead=`Открыт ${mod}. Забирай x2:`;list=rules('до '+FS.day(lu),'до '+FS.day(hu));target=lu;label='до конца x2 за уроки'}
   else if(now<hu){title='Последний шанс на x2';lead=`x2 за уроки ${mod} закончился, за домашку ещё действует:`;list=`<ul class="x2-u"><li><span>Домашки</span><b>x2 до ${FS.day(hu)}</b></li></ul>`;target=hu;label='до конца x2 за домашку'}
   else{el.innerHTML=`<div><div class="x2-t">Двойные баллы за скорость</div><p class="x2-p">Следующий x2 начнётся с открытием нового модуля. Больше баллов — быстрее растёшь по ${lad}.</p></div>`;clearInterval(el._t);return}
   const ms=Math.max(0,target-now),h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3),p=v=>String(v).padStart(2,'0');
   if(el._ph!==label){el._ph=label;el.innerHTML=`<div><div class="x2-t">${title}</div><p class="x2-p">${lead}</p>${list}<p class="x2-p x2-f">Больше баллов — быстрее растёшь по ${lad}.</p></div>
   <div class="x2-tw"><div class="x2-c">${label}</div><div class="x2-tm"><div class="g"><b data-k="h"></b><span>часы</span></div><i>:</i><div class="g"><b data-k="m"></b><span>минуты</span></div><i>:</i><div class="g"><b data-k="s"></b><span>секунды</span></div></div></div>`}
   const v={h:p(h),m:p(m),s:p(s)};el.querySelectorAll('[data-k]').forEach(b=>{if(b.textContent!==v[b.dataset.k])b.textContent=v[b.dataset.k]})};
  draw();clearInterval(el._t);el._t=setInterval(draw,1000)}
};

const post=()=>{try{parent.postMessage({fsProfH:document.getElementById('w').style.display==='none'?0:Math.ceil(document.body.getBoundingClientRect().height)+2},'*')}catch(e){}};
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(async D=>{const u=FS.uid();if(!u){post();return}const h=await FS.hash(u);const r=D.rows.find(x=>x.h===h);if(!r){post();return}
 document.getElementById('w').style.display='';FS.profile(document.getElementById('p'),D,r,{awards:'../awards/',me:/me=1/.test(location.hash)});post()}).catch(post);
addEventListener('resize',post);try{new ResizeObserver(post).observe(document.body)}catch(e){}document.fonts&&document.fonts.ready.then(post);
</script></body></html>
