<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Ближайшие открытия</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}html,body{background:transparent;color:#fff;font-family:"Inter Tight",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.c{background:#161616;border-radius:24px;padding:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.s{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:6px}
.i{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid rgba(255,255,255,.06)}
.i b{flex:none;min-width:96px;color:#d77fff;font-weight:600;font-size:14px}.i span{font-size:15px;line-height:1.35}
.i.now b{color:#1a0b2e;background:#c38bff;border-radius:99px;padding:3px 10px;min-width:0;font-size:12px}
.e{font-size:14px;color:rgba(255,255,255,.55);padding-top:10px}</style></head><body><div class="c"><div class="s">Поток AI-креатор 2.0 · первые 48 часов после открытия — x2 к баллам</div><div id="l"></div></div>
<script>const M=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(D=>{const now=new Date();const it=(D.schedule||[]).map(s=>({t:new Date(s.at),n:s.name})).filter(x=>x.t>now-48*36e5).slice(0,4);
document.getElementById('l').innerHTML=it.length?it.map(x=>{const live=x.t<=now;const d=live?'идёт x2':x.t.getDate()+' '+M[x.t.getMonth()]+', '+String(x.t.getHours()).padStart(2,'0')+':'+String(x.t.getMinutes()).padStart(2,'0');return`<div class="i${live?' now':''}"><b>${d}</b><span>${x.n.replace(/[<>&]/g,'')}</span></div>`}).join(''):'<div class="e">Все модули уже открыты</div>'})</script></body></html>
