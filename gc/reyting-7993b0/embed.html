<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Моё звание</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}html,body{background:transparent;color:#fff;font-family:"Inter Tight",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.g{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
.c{background:#161616;border-radius:26px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);padding:22px;display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:center;min-height:250px}
.aw{width:130px;aspect-ratio:1;background:center/cover;-webkit-mask:radial-gradient(closest-side,#000 62%,transparent);mask:radial-gradient(closest-side,#000 62%,transparent)}
.l{font-size:13px;color:rgba(255,255,255,.55)}.r{font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin:2px 0}
.n{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap}.n div{font-size:12px;color:rgba(255,255,255,.55)}.n b{display:block;font-size:24px;font-weight:500;color:#fff}.n small{font-size:14px;color:rgba(255,255,255,.55)}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9657e8,#d77fff)}
.nx{font-size:13px;color:rgba(255,255,255,.55);margin-top:8px}.nx b{color:#d77fff;font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
select{background:#0c0c0c;color:#fff;border:0;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);padding:9px 10px;font:500 13px inherit;font-family:inherit;max-width:230px}
a.b{display:inline-flex;background:linear-gradient(180deg,#fef8ff,#fccbff);color:#602364;font-weight:600;font-size:14px;border-radius:10px;padding:10px 14px;text-decoration:none}
.x{background:linear-gradient(115deg,#6724ad,#9657e8 60%,#c38bff);border-radius:26px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);min-height:250px}
.x .t{font-size:23px;font-weight:500;letter-spacing:-.02em}.x p{font-size:14px;line-height:1.45;color:rgba(255,255,255,.88);margin-top:6px}
.tm{display:flex;gap:8px}.tm div{background:rgba(0,1,6,.35);border-radius:12px;padding:8px 12px;font-size:12px;color:rgba(255,255,255,.75)}.tm b{display:block;font-size:21px;font-weight:500;color:#fff}
.md{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.md span{font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(195,139,255,.16);color:#d77fff}
@media(max-width:700px){.g{grid-template-columns:1fr}.c{grid-template-columns:90px 1fr;gap:14px;padding:18px}.aw{width:90px}.r{font-size:24px}.x{min-height:0}}
</style></head><body><div class="g"><div class="c" id="me"></div><div class="x" id="x2"></div></div>
<script>
const A='../awards/',PAGE='./';const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const fmt=n=>Number(n).toLocaleString('ru-RU');
let me=null;try{me=localStorage.getItem('rt-me-name')}catch(e){}
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(D=>{
 function draw(){const r=D.rows.find(x=>x.name===me)||null;const el=document.getElementById('me');
  const opts='<option value="">— выбери себя —</option>'+D.rows.map(x=>`<option${r&&x===r?' selected':''}>${esc(x.name)}</option>`).join('');
  if(!r){el.innerHTML=`<div class="aw" style="background-image:url(${A}r6.jpg)"></div><div><div class="l">Карьерная лестница потока</div><div class="r">Узнай своё звание</div><div class="nx">Выбери себя в списке один раз — дальше карточка будет показывать твои баллы, место и путь до следующего звания.</div><div class="row"><select id="s">${opts}</select><a class="b" href="${PAGE}" target="_blank">Весь рейтинг →</a></div></div>`}
  else{const k=D.ranks.findIndex(x=>x[0]===r.rank),nx=D.ranks[k+1],lo=D.ranks[k][1],hi=nx?nx[1]:lo,pc=nx?Math.min(100,Math.round(100*(r.pts-lo)/(hi-lo))):100;
   el.innerHTML=`<div class="aw" style="background-image:url(${A}${D.ranks[k][2]}.jpg)"></div><div><div class="l">Твоё звание · ${esc(D.ranks[k][3])}</div><div class="r">${esc(r.rank)}</div>
   <div class="n"><div><b>${fmt(r.pts)}</b>баллов</div><div><b>${r.place}<small> из ${D.n}</small></b>место</div><div><b>${r.lessons}</b>уроков</div><div><b>${r.hw}</b>домашек</div></div>
   <div class="bar"><i style="width:${pc}%"></i></div><div class="nx">${nx?`До звания <b>${esc(nx[0])}</b> — ещё ${fmt(Math.max(0,hi-r.pts))} баллов`:'Ты на вершине лестницы'}</div>
   ${r.medals.length?'<div class="md">'+r.medals.map(m=>'<span>'+esc(m)+'</span>').join('')+'</div>':''}
   <div class="row"><a class="b" href="${PAGE}" target="_blank">Весь рейтинг →</a><select id="s">${opts}</select></div></div>`}
  document.getElementById('s').onchange=e=>{me=e.target.value;try{localStorage.setItem('rt-me-name',me)}catch(_){}draw()}}
 draw();
 const X=D.x2,xe=document.getElementById('x2');
 xe.innerHTML=`<div><div class="t">${esc(X?X.title:'x2 за скорость')}</div><p>${esc(X?X.text:'Первые 48 часов после открытия модуля — x2 за уроки и анкеты, 72 часа — x2 за домашки.')}</p></div><div class="tm" id="tm"></div>`;
 if(X){const tick=()=>{const ms=new Date(X.until)-new Date(),h=Math.max(0,Math.floor(ms/36e5)),m=Math.max(0,Math.floor(ms%36e5/6e4));document.getElementById('tm').innerHTML=`<div><b>${h}</b>час.</div><div><b>${m}</b>мин.</div><div><b>×2</b>к баллам</div>`};tick();setInterval(tick,30000)}
});
</script></body></html>
