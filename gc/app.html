<style>

.sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}.sug button{height:32px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:12.5px;color:rgba(255,255,255,.88)}

.att{margin:0 16px 8px;display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;background:rgba(255,255,255,.05)}.att img{width:54px;height:40px;border-radius:8px;object-fit:cover}
/* ещё */

.list b{flex:1;color:#fff;font-weight:500;font-size:14.5px}.list em{font-style:normal;color:var(--ink3);font-size:13px}.list .ch{color:rgba(255,255,255,.3)}

#tabs .on{color:#d9b8ff}#tabs .tn{margin-top:0}#tabs .tnf{margin-top:-30px}#tabs .tnf{width:54px;height:54px;border-radius:99px;display:grid;place-items:center;background:#000106;box-shadow:0 0 0 2px rgba(195,139,255,.5),0 10px 26px -6px rgba(96,0,255,.8)}

.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.sk{height:120px;border-radius:24px;background:linear-gradient(90deg,#141414,#1d1d1d,#141414);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.hs{position:fixed;inset:0;z-index:9999;padding-top:var(--st);background:rgba(0,1,6,.7);display:flex;align-items:flex-end;justify-content:center}.hs .sh{position:relative;width:100%;max-width:520px;border-radius:26px 26px 0 0;background:#111;padding:22px 18px calc(18px + var(--sb));display:flex;flex-direction:column;gap:14px;box-shadow:0 -30px 80px -20px rgba(96,0,255,.6)}.hs h3{margin:0;padding-right:48px;font-size:22px;font-weight:500;letter-spacing:-.02em}.hs .x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.75);font-size:24px;display:grid;place-items:center}.hs ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}.hs li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#1a1a1a;font-size:15px;line-height:1.35;counter-increment:s}.hs li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(195,139,255,.18);color:#e2c9ff;font-weight:600;font-size:14px}.hs li svg{flex:none;vertical-align:middle}.hcard{flex-direction:row!important;align-items:center;gap:12px!important;background:linear-gradient(160deg,rgba(103,36,173,.5),var(--s1) 70%)!important;border-color:rgba(195,139,255,.3)!important}.hcard .ic{width:44px;height:44px;border-radius:13px;flex:none;background:#000106 url(ma/neuro.jpg) center/cover;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.hcard .hx{width:36px;height:36px;border-radius:10px;color:rgba(255,255,255,.5);font-size:20px;flex:none}

/* 26.10 вечер: шапка Telegram, загрузка, внутренние страницы, рейтинг */
:root{--st:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));--sb:max(env(safe-area-inset-bottom), calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px)))}
#scr{padding-top:calc(14px + var(--st))}#v-ai{top:var(--st)}
#tgtop{position:fixed;left:0;right:0;top:0;height:var(--st);background:#000106;z-index:40;pointer-events:none;box-shadow:0 1px 0 rgba(255,255,255,.05)}html:not(.fs) #tgtop{display:none}
#ldb{position:fixed;left:0;right:0;top:var(--st);height:3px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;overflow:hidden}#ldb.on{opacity:1}

.spn{width:20px;height:20px;border-radius:99px;border:2.5px solid rgba(195,139,255,.25);border-top-color:#c38bff;animation:spn .8s linear infinite;flex:none;box-sizing:border-box}@keyframes spn{to{transform:rotate(360deg)}}
#lde{position:fixed;left:16px;right:16px;bottom:calc(var(--tab) + 16px + var(--sb));z-index:62;display:none;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-radius:18px;background:#1a0f12;box-shadow:inset 0 0 0 1px rgba(255,143,143,.35),0 20px 60px rgba(0,0,0,.6);max-width:528px;margin:0 auto}#lde.on{display:flex}#lde b{flex:1;font-weight:500;font-size:14.5px}#lde button{height:40px;padding:0 16px;border-radius:12px;background:linear-gradient(180deg,#fef8ff,#fccbff);color:var(--plum);font-weight:600;font-size:14px;flex:none}
.busy{position:relative;pointer-events:none}.busy::after{content:"";position:absolute;right:12px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:99px;border:2px solid rgba(195,139,255,.3);border-top-color:#c38bff;animation:spn .8s linear infinite;box-sizing:border-box}
.pgh{display:flex;align-items:center;gap:12px;padding:2px 0 4px}.pgh b{font-size:23px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.bk{width:44px;height:44px;border-radius:14px;background:var(--s1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.list .ext{color:var(--ink3);font-size:15px}.list small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.sw{width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.15);position:relative;flex:none;transition:background .2s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:left .2s}.sw.on{background:#c38bff}.sw.on::after{left:21px}
.ph{width:96px;height:96px;border-radius:28px;object-fit:cover;object-position:50% 30%;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 20px 50px -20px rgba(150,87,232,.8)}
.tg2{display:flex;gap:8px;flex-wrap:wrap}.tg2 span{height:28px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.06);display:inline-flex;align-items:center;font-size:12.5px;color:rgba(255,255,255,.8)}
.ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}.ul li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}.ul li::before{content:"";width:6px;height:6px;border-radius:9px;background:#c38bff;margin-top:7px;flex:none}

.st{height:24px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;white-space:nowrap;flex:none}.st.ok{background:rgba(74,222,128,.12);color:#4ade80}.st.w{background:rgba(255,180,140,.14);color:#ffb48c}.st.l{background:rgba(195,139,255,.16);color:#e2c9ff}.st.no{background:rgba(255,255,255,.06);color:var(--ink2)}

.x2{border-radius:24px;padding:16px;background:linear-gradient(160deg,#5b2a12,#2a140c 60%,#160b08);box-shadow:inset 0 0 0 1px rgba(255,180,140,.35);display:flex;flex-direction:column;gap:10px}.x2 .cap{color:#ffb48c}

.tbl{display:flex;flex-direction:column}.tr.mine{background:rgba(195,139,255,.16);box-shadow:inset 0 0 0 1px rgba(195,139,255,.4)}.tr.mine em{color:#e2c9ff}.tbl .tr{padding:10px 8px;border-radius:12px}.tbl .tr b{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tbl .tr small{display:block;font-size:11.5px;color:var(--ink3);font-weight:400}.tbl .tr .pt{text-align:right;flex:none}.tbl .tr .pt i{display:block;font-style:normal;font-size:11.5px;color:#4ade80}

.tbl button.tr{width:100%;text-align:left;color:#fff;font:inherit}.rav{border-radius:99px;flex:none;display:inline-grid;place-items:center;color:#fff;font-weight:600;object-fit:cover}.tbl .rav{margin-right:2px}

    h+='<div class="card" style="padding:4px 14px 12px;gap:0"><button class="k-nr" data-n="quiet"'+(dis?' disabled':'')+'><span class="k-ic n">'+ic('moon',20)+'</span><span class="t"><b>Тихие часы</b><small>ничего не&nbsp;присылать ночью</small></span><span class="sw'+(+N.quiet?' on':'')+'"></span></button><div class="k-qh">'+sel('kQf',N.qfrom)+'<span class="mut">—</span>'+sel('kQt',N.qto)+'<span class="mut">МСК</span></div></div>';

  var save=function(){clearTimeout(tmo);tmo=setTimeout(function(){var snap=JSON.parse(JSON.stringify(prev));capi('/ma/notif',{method:'POST',body:JSON.stringify(N)}).then(function(j){if(j&&j.ok){prev=JSON.parse(JSON.stringify(N));return}N=snap;draw();lToast(j&&j.nf?'Настройки заработают после обновления':'Не сохранилось — попробуй ещё раз')}).catch(function(){N=snap;draw();lToast('Нет связи — не сохранилось')})},400)};
