.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.sk{height:120px;border-radius:24px;background:linear-gradient(90deg,#141414,#1d1d1d,#141414);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}

<script>
(function(){
var API='https://oduvanov-api.romanoduvanov52.workers.dev', GC='https://oduvanovroman.getcourse.ru', TGW=window.Telegram&&Telegram.WebApp, T=null, HOME=null, TOP=null, IMG=null, BUSY=false, CUR='learn';
var MCOV={935917160:'ma/m01.jpg',935917165:'ma/m02.jpg',935917169:'ma/m03.jpg',935917170:'ma/m04.jpg'}, RIMG={'Новичок':'r1','Джуниор':'r2','Фрилансер':'r3','Арт-директор':'r4','Владелец студии':'r5','Дизайнер-миллионер':'r6'};

function $(i){return document.getElementById(i)}

function openExt(u){if(/^https?:\/\/(t\.me|telegram\.me)\//.test(u)){try{TGW.openTelegramLink(u);return}catch(e){}}if(u.indexOf(GC)===0){location.href=gcUrl(u);return}try{TGW.openLink(u)}catch(e){window.open(u,'_blank')}}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-go]');if(!a)return;e.preventDefault();var g=a.getAttribute('data-go');if(g.charAt(0)==='/')openGC(g);else openExt(g)});
function api(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});if(T)o.headers.Authorization='Bearer '+T.t;return fetch(API+p,o).then(function(r){if(r.status===401&&T){T=null;try{sessionStorage.removeItem('maT')}catch(e){}return auth().then(function(){return api(p,o)})}return r.json()})}

function dshort(iso){var d=new Date(iso);return {d:d.getDate(),m:MS[d.getMonth()],wd:WD[d.getDay()],t:d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}}

  var d=new Date(),wd=WD[d.getDay()];h+='<div class="hi"><span><small>'+wd.charAt(0).toUpperCase()+wd.slice(1)+', '+d.getDate()+' '+MON[d.getMonth()]+'</small><b>Привет, '+esc((m.name||'').split(' ')[0]||'друг')+'</b></span><span class="pill">'+m.pts+' баллов</span></div>';
  var live=mods.filter(function(x){return x.open}).slice(-1)[0], nextM=mods.filter(function(x){return !x.open})[0];

  else if(live){h+='<div class="card"><span class="mut3">Продолжить</span><b style="font-size:19px;font-weight:500">'+esc(live.name)+'</b><span class="mut">'+esc(live.desc||'')+'</span><a class="btn" href="#" data-go="/teach/control/stream/view/id/'+live.id+'">Открыть модуль</a></div>'}
  var pr=m.total?Math.round(m.lessons/m.total*100):0;
